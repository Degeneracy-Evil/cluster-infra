---
cluster_name: test-cluster

os_release: "24.04"
timezone: Asia/Shanghai

ansible_user: clusteradmin

disable_unattended_upgrades: true
kernel_hold: true

nvidia_gpu_required: false
nvidia_driver_expected_branch: ""
nvidia_driver_expected_version: ""
nvidia_driver_packages: []

base_packages:
  - vim
  - curl
  - wget
  - git
  - htop
  - tmux
  - rsync
  - jq
  - pciutils
  - usbutils
  - lsof
  - tree

base_admin_users: []
base_sysctl: {}
base_limits: []
