---
# RFC 5737 documentation addresses deliberately prevent accidental access.
# Replace these values with the management addresses of isolated test VMs.
all:
  children:
    compute:
      hosts:
        n01:
          ansible_host: 192.0.2.101
          fabric_interfaces:
            - name: ens4
              address: 10.20.0.101/24
              mtu: 1500
        n02:
          ansible_host: 192.0.2.102
          fabric_interfaces:
            - name: ens4
              address: 10.20.0.102/24
              mtu: 1500
    bootstrap:
      hosts:
        n01: {}
