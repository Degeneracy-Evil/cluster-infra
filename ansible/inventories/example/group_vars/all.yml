---
cluster_name: example-cluster

os_release: "24.04"
timezone: Asia/Shanghai

ansible_user: clusteradmin

disable_unattended_upgrades: true
kernel_hold: true

# CPU-only nodes remain valid unless this is overridden per host.
nvidia_gpu_required: false
# Exact version takes precedence when both values are configured.
nvidia_driver_expected_branch: ""
nvidia_driver_expected_version: ""
# Used only by the explicitly invoked apply-versions.yml playbook.
nvidia_driver_packages: []
#  - nvidia-driver-595-server-open

base_packages:
  - vim
  - curl
  - wget
  - git
  - htop
  - tmux
  - rsync
  - jq
  - pciutils
  - usbutils
  - lsof
  - tree

# Add administrators only after replacing the example public key.
base_admin_users: []
#  - name: clusteradmin
#    groups:
#      - sudo
#    authorized_keys:
#      - "ssh-ed25519 REPLACE_WITH_A_REAL_PUBLIC_KEY operator@example"

base_sysctl: {}
#  vm.swappiness: "10"

base_limits: []
