---
cluster_name: example-cluster

os_release: "24.04"
timezone: Asia/Shanghai

ansible_user: clusteradmin

disable_unattended_upgrades: true
kernel_hold: true

base_packages:
  - vim
  - curl
  - wget
  - git
  - htop
  - tmux
  - rsync
  - jq
  - pciutils
  - usbutils
  - lsof
  - tree

